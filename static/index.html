<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditLens &mdash; Bank Credit &amp; Customer Analytics</title>
    <meta name="description" content="Customer analytics across the bank lifecycle: acquire, lend, retain. A learning project, not a production credit tool.">
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>

  <body>
    <main class="shell">
      <header class="masthead">
        <h1>CreditLens</h1>
        <p class="tagline">Acquire, lend, retain: customer analytics with scikit-learn</p>
      </header>

      <div class="card">
        <form id="assessment-form" novalidate>
          <div class="selectors">
            <div class="field">
              <label for="dataset-select">Dataset</label>
              <select id="dataset-select" name="dataset"></select>
            </div>

            <div class="field">
              <label for="model-select">Model</label>
              <select id="model-select" name="model_type"></select>
            </div>
          </div>

          <hr class="divider">

          <fieldset class="measurements">
            <legend>Customer details</legend>
            <div class="grid" id="dynamic-fields"></div>
          </fieldset>

          <button type="submit" id="submit-btn">
            <span class="btn-label">Run prediction</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <div id="result" class="result" role="status" aria-live="polite" hidden></div>
      </div>

      <footer class="colophon">
        <p class="disclaimer">
          This is a learning project for bank staff analytics, not a production credit tool.
          It should not be used for real lending or customer decisions.
        </p>
        <p class="links">
          <a href="/api/datasets">API</a>
          <span aria-hidden="true">&middot;</span>
          <a href="/api/metrics">Metrics</a>
          <span aria-hidden="true">&middot;</span>
          <a href="/healthz">Health</a>
        </p>
      </footer>
    </main>

    <script src="/static/js/app.js"></script>
  </body>
</html>
